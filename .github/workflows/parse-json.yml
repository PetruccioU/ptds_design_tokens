name: Parse and Prettify JSON

on:
  repository_dispatch:
    types: [parse-json]

jobs:
  prettify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Parse JSON
        env:
          FILENAME: ${{ github.event.client_payload.filename }}
        run: |
          echo "Received filename: $FILENAME"
          npx ts-node parse-json.ts "$FILENAME"
