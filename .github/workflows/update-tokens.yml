name: Update Tokens

on:
  repository_dispatch:
    types: [update-tokens]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Print payload
        run: |
          echo "Payload: ${{ toJson(github.event.client_payload) }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Update tokens file
        run: |
          # Extract filename or use default
          FILENAME="${{ github.event.client_payload.filename }}"
          if [ -z "$FILENAME" ]; then FILENAME="tokens.json"; fi

          # Configure Git
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Write tokens string to file
          echo '${{ github.event.client_payload.tokens }}' > "$FILENAME"

          # Commit with provided message or fallback
          COMMIT_MSG="${{ github.event.client_payload.commitMessage }}"
          if [ -z "$COMMIT_MSG" ]; then COMMIT_MSG="Update design tokens"; fi

          # Only commit if there are changes
          git add "$FILENAME"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "$COMMIT_MSG"
            git push
          fi

      - name: Parse and prettify JSON
        run: |
          FILENAME="${{ github.event.client_payload.filename }}"
          if [ -z "$FILENAME" ]; then FILENAME="tokens.json"; fi
          
          echo "Parsing filename: $FILENAME"
          npx ts-node parse-json.ts "$FILENAME"
          
          # Commit the prettified file if it exists
          if ls pretty-*.json 1> /dev/null 2>&1; then
            git add pretty-*.json
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Add prettified JSON file"
              git push
            fi
          else
            echo "No pretty file generated"
          fi
