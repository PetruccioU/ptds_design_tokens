name: Update Tokens

on:
  repository_dispatch:
    types: [update-tokens]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Print payload
        run: |
          echo "Payload: ${{ toJson(github.event.client_payload) }}"

      - name: Update tokens file
        run: |
          # Extract filename or use default
          FILENAME="${{ github.event.client_payload.filename }}"
          if [ -z "$FILENAME" ]; then FILENAME="tokens.json"; fi

          # Configure Git
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Write tokens string to file
          echo '${{ github.event.client_payload.tokens }}' > "$FILENAME"

          # Commit with provided message or fallback
          COMMIT_MSG="${{ github.event.client_payload.commitMessage }}"
          if [ -z "$COMMIT_MSG" ]; then COMMIT_MSG="Update design tokens"; fi

          git add "$FILENAME"
          git commit -m "$COMMIT_MSG"
          git push

      - name: Trigger Parse JSON Workflow
        run: |
          FILENAME="${{ github.event.client_payload.filename }}"
          if [ -z "$FILENAME" ]; then FILENAME="tokens.json"; fi
          
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d "{\"event_type\":\"parse-json\",\"client_payload\":{\"filename\":\"$FILENAME\"}}"    
