name: Update Tokens

on:
  repository_dispatch:
    types: [update-tokens]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Create and checkout date-time branch
        run: |
          # Create branch name with current date-time
          BRANCH_NAME="tokens-$(date +'%Y%m%d-%H%M%S')"
          echo "Creating branch: $BRANCH_NAME"
          
          # Configure Git
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          # Create and checkout new branch
          git checkout -b "$BRANCH_NAME"

      - name: Print payload
        env:
          # printing entire payload for debugging
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "Payload: $PAYLOAD"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Update tokens file
        env:
          TOKENS: "${{ toJson(github.event.client_payload.tokens) }}"
        run: |
          FILEPATH="src/DesignTokens/tokens.json"
          COMMIT_MSG="Update design tokens"

          # Create directory if it doesn't exist
          mkdir -p "$(dirname "$FILEPATH")"

          # Write tokens string to file
          echo "$TOKENS" > "$FILEPATH"

          # Only commit if there are changes
          git add "$FILEPATH"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "$COMMIT_MSG"
            git push --set-upstream origin HEAD
          fi
